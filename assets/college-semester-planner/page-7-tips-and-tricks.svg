<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 2550 3300"><rect width="2550" height="3300" fill="#f4b400"/><rect x="55" y="55" width="2440" height="3190" rx="45" fill="#f4b400" stroke="#0b2e4f" stroke-width="14"/><text x="1275" y="205" fill="#0b2e4f" font-family="Arial,Helvetica,sans-serif" font-size="88" font-weight="900" text-anchor="middle" letter-spacing="3">TIPS + TRICKS</text><text x="1275" y="270" fill="#ee2a7b" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" text-anchor="middle" letter-spacing="4">COLLEGE SUCCESS, MADE PRACTICAL</text><line x1="180" y1="315" x2="2370" y2="315" stroke="#ee2a7b" stroke-width="12" /><rect x="150" y="410" width="2250" height="360" rx="42" fill="#f4b400" stroke="#ee2a7b" stroke-width="12"/><circle cx="310" cy="590" r="95" fill="#ee2a7b" stroke="none" stroke-width="0"/><text x="310" y="613" fill="#f4b400" font-family="Arial,Helvetica,sans-serif" font-size="66" font-weight="900" text-anchor="middle" >1</text><text x="470" y="535" fill="#ee2a7b" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="900" text-anchor="start" >BREAK BIG TASKS DOWN</text><text x="470" y="615" fill="#0b2e4f" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="600" text-anchor="start" >Turn one intimidating assignment into small, scheduled actions.</text><line x1="470" y1="670" x2="2230" y2="670" stroke="#ee2a7b" stroke-width="5" /><rect x="150" y="850" width="2250" height="360" rx="42" fill="#f4b400" stroke="#0b2e4f" stroke-width="12"/><circle cx="310" cy="1030" r="95" fill="#0b2e4f" stroke="none" stroke-width="0"/><text x="310" y="1053" fill="#f4b400" font-family="Arial,Helvetica,sans-serif" font-size="66" font-weight="900" text-anchor="middle" >2</text><text x="470" y="975" fill="#0b2e4f" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="900" text-anchor="start" >PLAN THE WEEK FIRST</text><text x="470" y="1055" fill="#0b2e4f" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="600" text-anchor="start" >Block classes, study time, meals, rest, and travel before extras.</text><line x1="470" y1="1110" x2="2230" y2="1110" stroke="#0b2e4f" stroke-width="5" /><rect x="150" y="1290" width="2250" height="360" rx="42" fill="#f4b400" stroke="#ee2a7b" stroke-width="12"/><circle cx="310" cy="1470" r="95" fill="#ee2a7b" stroke="none" stroke-width="0"/><text x="310" y="1493" fill="#f4b400" font-family="Arial,Helvetica,sans-serif" font-size="66" font-weight="900" text-anchor="middle" >3</text><text x="470" y="1415" fill="#ee2a7b" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="900" text-anchor="start" >USE ACTIVE RECALL</text><text x="470" y="1495" fill="#0b2e4f" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="600" text-anchor="start" >Close the notes. Ask a question. Retrieve the answer from memory.</text><line x1="470" y1="1550" x2="2230" y2="1550" stroke="#ee2a7b" stroke-width="5" /><rect x="150" y="1730" width="2250" height="360" rx="42" fill="#f4b400" stroke="#0b2e4f" stroke-width="12"/><circle cx="310" cy="1910" r="95" fill="#0b2e4f" stroke="none" stroke-width="0"/><text x="310" y="1933" fill="#f4b400" font-family="Arial,Helvetica,sans-serif" font-size="66" font-weight="900" text-anchor="middle" >4</text><text x="470" y="1855" fill="#0b2e4f" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="900" text-anchor="start" >START BEFORE YOU FEEL READY</text><text x="470" y="1935" fill="#0b2e4f" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="600" text-anchor="start" >A focused ten-minute start can create the momentum you need.</text><line x1="470" y1="1990" x2="2230" y2="1990" stroke="#0b2e4f" stroke-width="5" /><rect x="150" y="2170" width="2250" height="360" rx="42" fill="#f4b400" stroke="#ee2a7b" stroke-width="12"/><circle cx="310" cy="2350" r="95" fill="#ee2a7b" stroke="none" stroke-width="0"/><text x="310" y="2373" fill="#f4b400" font-family="Arial,Helvetica,sans-serif" font-size="66" font-weight="900" text-anchor="middle" >5</text><text x="470" y="2295" fill="#ee2a7b" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="900" text-anchor="start" >PROTECT OFFICE HOURS</text><text x="470" y="2375" fill="#0b2e4f" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="600" text-anchor="start" >Bring one clear question and leave with one specific next step.</text><line x1="470" y1="2430" x2="2230" y2="2430" stroke="#ee2a7b" stroke-width="5" /><rect x="150" y="2610" width="2250" height="360" rx="42" fill="#f4b400" stroke="#0b2e4f" stroke-width="12"/><circle cx="310" cy="2790" r="95" fill="#0b2e4f" stroke="none" stroke-width="0"/><text x="310" y="2813" fill="#f4b400" font-family="Arial,Helvetica,sans-serif" font-size="66" font-weight="900" text-anchor="middle" >6</text><text x="470" y="2735" fill="#0b2e4f" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="900" text-anchor="start" >REST IS PART OF THE PLAN</text><text x="470" y="2815" fill="#0b2e4f" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="600" text-anchor="start" >Consistent sleep and real breaks make focused work possible.</text><line x1="470" y1="2870" x2="2230" y2="2870" stroke="#0b2e4f" stroke-width="5" /><path d="M 1275 3089.2 C 1241.4 3062,1211 3108.4,1275 3158 C 1339 3108.4,1308.6 3062,1275 3089.2Z" fill="#ee2a7b"/><text x="1420" y="3155" fill="#0b2e4f" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="900" text-anchor="middle" >PROGRESS OVER PERFECTION</text></svg>